[project]
name = "leafline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch",
    "torchvision",
    "jupyterlab",
    "numpy",
    "matplotlib",
    "pillow",
    "opencv-python",
    "rasterio",
    "scikit-learn",
    "pandas",
    "tqdm",
    "seaborn",
    "shapely",
]

[tool.uv.sources]
torch = [{ index = "pytorch-rocm" }]
torchvision = [{ index = "pytorch-rocm" }]
torchaudio = [{ index = "pytorch-rocm" }]
triton-rocm = [{ index = "pytorch-rocm" }]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
