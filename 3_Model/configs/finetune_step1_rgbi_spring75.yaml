# NDVI-Test: bringt der abgeleitete NDVI-Kanal bei reinen Frühjahrs-7.5cm-Bildern etwas?
# EXAKT identisch zu finetune_step1_spring75.yaml (100% Frühjahr 7.5cm, minimale
# Augmentierung, getuntes PP 30/2, LR 1e-4) — der EINZIGE Unterschied ist
# in_channels: 4 statt 5, also RGBI OHNE NDVI. So misst der Vergleich step1 (5ch,
# mit NDVI) vs. dieses Modell (4ch, ohne NDVI) rein den NDVI-Beitrag.
#
# Hypothese: NDVI = (NIR-R)/(NIR+R) ist ein abgeleiteter Greenness-Index, im Sommer
# stark, im Frühjahr schwächer (weniger Blattgrün) — und das vortrainierte Netz lernte
# NDVI in einem Sommer-Kontext. Bei Frühjahrsbildern könnte NDVI überflüssig oder sogar
# störend sein (das Netz hat R und NIR ohnehin und kann jede nützliche Kombination lernen).
# Datenseitig nichts Neues nötig: dataset.py verwirft NDVI via channel_indices_for(4)=[0,1,2,3];
# model_utils.py reduziert die erste Conv 5→4 (behält die RGBI-Gewichte).
paths:
  base: /home/leafline/leafline/Data/Kiel/TrainingAreas
  pretrained: ~/pretrained_models/freudenberg2022.pt
  output: /home/leafline/leafline/3_Model/runs/step1_rgbi_spring75

data:
  patch_size: 256

  train_areas:
    - area: HoernSued
      gt_file: train/HoernSued_GroundTruth.shp
    - area: SchuetzenparkMitte
      gt_file: train/SchuetzenparkMitte_GroundTruth.shp
    - area: SchuetzenparkOst
      gt_file: train/SchuetzenparkOst_GroundTruth.shp
    - area: SchuetzenparkWest
      gt_file: train/SchuetzenparkWest_GroundTruth.shp

  valid_areas:
    - area: Schule
      gt_file: valid/Schule_GroundTruth.shp
    - area: Schwentine
      gt_file: valid/Schwentine_GroundTruth.shp
    - area: Veloroute
      gt_file: valid/Veloroute_GroundTruth.shp

  test_areas:
    - area: BotGarten
      gt_file: test/BotGarten_GroundTruth.shp
    - area: HoernNord
      gt_file: test/HoernNord_GroundTruth.shp

  augment:
    hflip: true
    vflip: true
    brightness: true
    contrast: true
    nir_scale: false
    ndvi_scale: false
    spectral_noise: false

model:
  in_channels: 4   # R G B I — OHNE NDVI (der EINZIGE Unterschied zu step1)
  lr: 1.0e-4

training:
  batch_size: 8
  num_workers: 4
  max_epochs: 50
  patience: 10
  oversample_small: false

# 7.5cm-getuntes PP (identisch zu finetune_step1_spring75.yaml → fairer Vergleich)
postprocessing:
  mask_exp: 2
  outline_multiplier: 5
  outline_exp: 12   # getunt (pp_sweep, Test): hochkonfidente Grenzen trennen gemergte Kronen
  dist_exp: 0.5
  sigma: 2
  binary_threshold: 0.10
  min_dist: 30
  label_threshold: 0.10
  area_min: 3
  simplify: 0.3
