# Schritt 1 - finale Variante mit CV-bester Lernrate (isolierter Hyperparameter-Effekt).
# Identisch zu finetune_step1_spring75.yaml (100% Frühjahr 7.5cm, RGBI+NDVI, minimale
# Augmentierung, getuntes PP 30/2), NUR die LR ist anders: 5e-5 statt 1e-4.
# CV (runs/step1_spring75/cv_results.csv, 3 Folds): 5e-5 = mean val_F1 0.768 (±0.06),
# klar über 1e-4 (0.751) und stabiler. Eigenes Output-Verzeichnis, damit step1_spring75
# als Fixe-LR-Referenz erhalten bleibt → direkter LR-Vergleich.
paths:
  base: /home/leafline/leafline/Data/Kiel/TrainingAreas
  pretrained: ~/pretrained_models/freudenberg2022.pt
  output: /home/leafline/leafline/3_Model/runs/step1_spring75_cvlr

data:
  patch_size: 256

  train_areas:
    - area: HoernSued
      gt_file: train/HoernSued_GroundTruth.shp
    - area: SchuetzenparkMitte
      gt_file: train/SchuetzenparkMitte_GroundTruth.shp
    - area: SchuetzenparkOst
      gt_file: train/SchuetzenparkOst_GroundTruth.shp
    - area: SchuetzenparkWest
      gt_file: train/SchuetzenparkWest_GroundTruth.shp

  valid_areas:
    - area: Schule
      gt_file: valid/Schule_GroundTruth.shp
    - area: Schwentine
      gt_file: valid/Schwentine_GroundTruth.shp
    - area: Veloroute
      gt_file: valid/Veloroute_GroundTruth.shp

  test_areas:
    - area: BotGarten
      gt_file: test/BotGarten_GroundTruth.shp
    - area: HoernNord
      gt_file: test/HoernNord_GroundTruth.shp

  augment:
    hflip: true
    vflip: true
    brightness: true
    contrast: true
    nir_scale: false
    ndvi_scale: false
    spectral_noise: false

model:
  in_channels: 5
  lr: 5.0e-5   # CV-beste LR (step1); Fixe-LR-Referenz nutzte 1e-4

training:
  batch_size: 8
  num_workers: 4
  max_epochs: 50
  patience: 10
  oversample_small: false

# 7.5cm-getuntes PP (wie finetune_step1_spring75.yaml)
postprocessing:
  mask_exp: 2
  outline_multiplier: 5
  outline_exp: 1
  dist_exp: 0.5
  sigma: 2
  binary_threshold: 0.10
  min_dist: 30
  label_threshold: 0.10
  area_min: 3
  simplify: 0.3
