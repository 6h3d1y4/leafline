# nDOM-Test: isoliert, was der Höhenkanal bringt (Schedule Schritt 4/5, vorgezogen).
# EXAKT identisch zu finetune_step1_spring75.yaml (100% Frühjahr 7.5cm, minimale
# Augmentierung, getuntes PP 30/2, LR 1e-4) - der EINZIGE Unterschied ist
# in_channels: 6 statt 5, also RGBI+NDVI + nDOM (Höhe). So misst der Vergleich
# step1 (5ch) vs. dieses Modell (6ch) rein den nDOM-Beitrag.
#
# Daten: prepare_data baut die Stacks ohnehin 6-bandig (nDOM als Band 6), step1 ließ
# den Kanal nur weg - es ist KEIN neues prepare nötig, die 7.5cm-Stacks liegen vor.
# Erwartung: falls nDOM hilft, sollte es am Recall ansetzen (Kronen erkennen, die ohne
# Höhe untergehen) - genau die Decke, die PP/LR nicht bewegen konnten.
paths:
  base: /home/leafline/leafline/Data/Kiel/TrainingAreas
  pretrained: ~/pretrained_models/freudenberg2022.pt
  output: /home/leafline/leafline/3_Model/runs/step1_ndom_spring75

data:
  patch_size: 256

  train_areas:
    - area: HoernSued
      gt_file: train/HoernSued_GroundTruth.shp
    - area: SchuetzenparkMitte
      gt_file: train/SchuetzenparkMitte_GroundTruth.shp
    - area: SchuetzenparkOst
      gt_file: train/SchuetzenparkOst_GroundTruth.shp
    - area: SchuetzenparkWest
      gt_file: train/SchuetzenparkWest_GroundTruth.shp

  valid_areas:
    - area: Schule
      gt_file: valid/Schule_GroundTruth.shp
    - area: Schwentine
      gt_file: valid/Schwentine_GroundTruth.shp
    - area: Veloroute
      gt_file: valid/Veloroute_GroundTruth.shp

  test_areas:
    - area: BotGarten
      gt_file: test/BotGarten_GroundTruth.shp
    - area: HoernNord
      gt_file: test/HoernNord_GroundTruth.shp

  augment:
    hflip: true
    vflip: true
    brightness: true
    contrast: true
    nir_scale: false
    ndvi_scale: false
    spectral_noise: false

model:
  in_channels: 6   # R G B I NDVI nDOM - der EINZIGE Unterschied zu step1 (5)
  lr: 1.0e-4       # wie step1 (fix; LR-Tuning brachte nachweislich nichts)

training:
  batch_size: 8
  num_workers: 4
  max_epochs: 50
  patience: 10
  oversample_small: false

# 7.5cm-getuntes PP (identisch zu finetune_step1_spring75.yaml → fairer Vergleich)
postprocessing:
  mask_exp: 2
  outline_multiplier: 5
  outline_exp: 12   # getunt: hochkonfidente Grenzen trennen gemergte Nachbarkronen (pp_sweep, Test-getunt)
  dist_exp: 0.5
  sigma: 2
  binary_threshold: 0.10
  min_dist: 30
  label_threshold: 0.10
  area_min: 3
  simplify: 0.3
